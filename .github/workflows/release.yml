name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
        default: "v0.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            extension: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            extension: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            extension: ".exe"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          package="phosphornet_${GOOS}_${GOARCH}"
          mkdir -p "dist/${package}"
          for binary in phosphor phosphord switchboard; do
            go build -trimpath -ldflags="-s -w" -o "dist/${package}/${binary}${{ matrix.extension }}" "./cmd/${binary}"
          done
          cp -R doors "dist/${package}/doors"
          cp install.sh "dist/${package}/install.sh"

      - name: Package tarball
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          package="phosphornet_${{ matrix.goos }}_${{ matrix.goarch }}"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Package zip
        if: matrix.archive == 'zip'
        run: |
          set -euo pipefail
          package="phosphornet_${{ matrix.goos }}_${{ matrix.goarch }}"
          (cd dist && zip -qr "${package}.zip" "${package}")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phosphornet_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/phosphornet_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" dist/phosphornet_* --clobber
